<body>
<div class="app" id="app"></div>

<script>
/* ===================== DATA LAYER — Supabase (real shared database) ===================== */
const SUPABASE_URL = 'https://psvvecfbfvwfdddbbcpg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzdnZlY2ZiZnZ3ZmRkZGJiY3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDA5ODYsImV4cCI6MjEwMzcxNjk4Nn0.5h2P5aiWY61DLilOlvMsehwQZAB6THoJCZOFdbdK6tY';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---- mapping helpers: DB uses snake_case, the app uses camelCase ---- */
function productFromDb(r){
  return { id:r.id, name:r.name, category:r.category, price:Number(r.price), stock:r.stock,
    desc:r.description, emoji:r.emoji||'🎂', img:r.img||null,
    priceHistory: r.price_history||[], scheduledPrices: r.scheduled_prices||[] };
}
function productToDb(p){
  return { id:p.id, name:p.name, category:p.category, price:p.price, stock:p.stock,
    description:p.desc, emoji:p.emoji, img:p.img||null,
    price_history:p.priceHistory||[], scheduled_prices:p.scheduledPrices||[] };
}
function orderFromDb(r){
  return { id:r.id, customerName:r.customer_name, phone:r.phone, email:r.email||'', address:r.address,
    items:r.items||[], total:Number(r.total), paymentMethod:r.payment_method, paymentStatus:r.payment_status,
    flutterwaveRef:r.flutterwave_ref, status:r.status, source:r.source, date:r.created_at };
}
function customerFromDb(r){
  return { id:r.id, name:r.name, phone:r.phone, email:r.email||'', joined:r.joined, orders:r.orders, spent:Number(r.spent) };
}
function expenseFromDb(r){
  return { id:r.id, desc:r.description, category:r.category, amount:Number(r.amount), date:r.date };
}
function settingsFromDb(r){
  return { bankName:r.bank_name||'', bankAccountNumber:r.bank_account_number||'', bankAccountName:r.bank_account_name||'Nahaj Royal Treat',
    cardPaymentNote:r.card_payment_note||'', flutterwavePublicKey:r.flutterwave_public_key||'' };
}

let DB = { products:[], orders:[], customers:[], expenses:[], settings:{} };

/* ---- Image upload helpers: admin uploads a real photo, we compress it client-side
   and store it as a data URL directly on the product, so it always renders with
   zero dependency on external image hosting. ---- */
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 700; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
let pendingProductImage = null;

/* Returns markup for a product thumbnail: real photo if available, emoji fallback otherwise */
function thumbHTML(p){
  if(p.img) return `<img class="thumb-img" src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','${p.emoji}')">`;
  return p.emoji;
}


async function loadDB(){
  const [{data:products,error:pe}, {data:settingsRow}] = await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('settings').select('*').eq('id',1).maybeSingle()
  ]);
  if(pe) console.error('Could not load products', pe);
  DB.products = (products||[]).map(productFromDb);
  DB.settings = settingsRow ? settingsFromDb(settingsRow) : {
    bankName:'', bankAccountNumber:'', bankAccountName:'Nahaj Royal Treat',
    cardPaymentNote:'Our team will send you a secure card payment link on WhatsApp after your order is confirmed.',
    flutterwavePublicKey:''
  };
  // orders/customers/expenses are admin-only (see RLS) — loaded separately once staff is logged in
  if(S.bizLoggedIn) await loadAdminData();
}
async function loadAdminData(){
  const [{data:orders}, {data:customers}, {data:expenses}] = await Promise.all([
    sb.from('orders').select('*').order('created_at',{ascending:false}),
    sb.from('customers').select('*'),
    sb.from('expenses').select('*').order('date',{ascending:false})
  ]);
  DB.orders = (orders||[]).map(orderFromDb);
  DB.customers = (customers||[]).map(customerFromDb);
  DB.expenses = (expenses||[]).map(expenseFromDb);
}

/* Apply any scheduled price changes whose effective time has arrived (runs client-side
   when staff have the Products tab open; for a fully hands-off version this same logic
   could be moved into a Supabase scheduled Edge Function). */
async function applyScheduledPrices(){
  const now = new Date();
  let changed = false;
  for(const pr of DB.products){
    if(!pr.scheduledPrices || !pr.scheduledPrices.length) continue;
    const due = pr.scheduledPrices.filter(s=>new Date(s.effectiveAt) <= now);
    if(due.length){
      due.sort((a,b)=>new Date(a.effectiveAt)-new Date(b.effectiveAt));
      const latest = due[due.length-1];
      pr.price = latest.price;
      pr.priceHistory.unshift({price:latest.price, date:latest.effectiveAt, note: latest.note ? `Scheduled: ${latest.note}` : 'Scheduled price change'});
      pr.scheduledPrices = pr.scheduledPrices.filter(s=>new Date(s.effectiveAt) > now);
      await sb.from('products').update({ price:pr.price, price_history:pr.priceHistory, scheduled_prices:pr.scheduledPrices }).eq('id', pr.id);
      changed = true;
    }
  }
  return changed;
}

function addToCart(pid, qty){

/* ===================== CHECKOUT / ORDER CREATION -> shared with POS ===================== */
async function placeOrder(formData){
  const items = S.cart.map(c=>{
    const p = DB.products.find(p=>p.id===c.productId);
    return { productId:c.productId, name:p.name, qty:c.qty, price:p.price };
  });
  const total = items.reduce((a,i)=>a+i.price*i.qty,0);
  const orderId = uid('ORD-');

  const { error } = await sb.rpc('place_order', {
    p_id: orderId,
    p_customer_name: formData.name,
    p_phone: formData.phone,
    p_email: formData.email || null,
    p_address: formData.address,
    p_items: items,
    p_total: total,
    p_payment_method: formData.paymentMethod || 'Pay on Delivery',
    p_flutterwave_ref: formData.flutterwaveRef || null,
    p_payment_status: formData.paymentStatus || 'Unpaid'
  });
  if(error){ showToast('Could not place order: ' + error.message); throw error; }

  // reflect the new stock levels locally right away (storefront + POS share the same DB)
  items.forEach(i=>{
    const p = DB.products.find(p=>p.id===i.productId);
    if(p) p.stock = Math.max(0, p.stock - i.qty);
  });

  S.cart = []; savePrivCart();
  S.account = {name:formData.name, phone:formData.phone, email:formData.email||''};
  savePrivAccount();

  return {
    id: orderId, customerName: formData.name, phone: formData.phone, email: formData.email||'',
    address: formData.address, items, total,
    paymentMethod: formData.paymentMethod || 'Pay on Delivery',
    paymentStatus: formData.paymentStatus || 'Unpaid',
    flutterwaveRef: formData.flutterwaveRef || null,
    status:'Pending', source:'Website', date: new Date().toISOString()
  };
}

/* Builds a complete, correctly-encoded WhatsApp message.
   IMPORTANT: the whole message is passed through encodeURIComponent so that any
   special characters typed into the name/address fields (&, #, %, line breaks, etc.)
   can never cut the message short — this is what was truncating orders before. */
function waLink(order){
  let msg = `Hello NAHAJ Royal Treat! 👑\nI'd like to confirm my order ${order.id}:\n\n`;
  order.items.forEach(i=>{ msg += `• ${i.name} x${i.qty} — ${money(i.price*i.qty)}\n`; });
  msg += `\nTotal: ${money(order.total)}`;
  msg += `\nPayment Method: ${order.paymentMethod || 'Pay on Delivery'}`;
  if(order.paymentMethod === 'Bank Transfer'){
    const s = DB.settings || {};
    if(s.bankName || s.bankAccountNumber){
      msg += `\n\nBank Transfer Details:\nBank: ${s.bankName||'—'}\nAccount Number: ${s.bankAccountNumber||'—'}\nAccount Name: ${s.bankAccountName||'Nahaj Royal Treat'}`;
    }
  } else if(order.paymentMethod === 'Card Payment'){
    msg += `\n\nPayment: ${order.paymentStatus==='Paid' ? 'Paid via Flutterwave ✅' : 'Not yet paid'}`;
    if(order.flutterwaveRef) msg += `\nTransaction Ref: ${order.flutterwaveRef}`;
  }
  msg += `\n\nDelivery Address: ${order.address}\nName: ${order.customerName}\nPhone: ${order.phone}`;
  return `https://wa.me/2348142658586?text=${encodeURIComponent(msg)}`;
}

/* ---- Flutterwave inline checkout ---- */
function payWithFlutterwave(){
  const name = document.getElementById('ckName').value.trim();
  const phone = document.getElementById('ckPhone').value.trim();
  const email = document.getElementById('ckEmail').value.trim();
  const address = document.getElementById('ckAddress').value.trim();
  if(!name || !phone || !address){ showToast('Please fill in name, phone and address first'); return; }
  if(typeof FlutterwaveCheckout !== 'function'){
    showToast('The payment gateway could not load — please check your connection or try another payment method');
    return;
  }
  const txRef = 'NRT-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
  FlutterwaveCheckout({
    public_key: DB.settings.flutterwavePublicKey,
    tx_ref: txRef,
    amount: cartTotal(),
    currency: 'NGN',
    payment_options: 'card,banktransfer,ussd',
    customer: { email: email || 'guest@nahajroyaltreat.com', phone_number: phone, name: name },
    customizations: {
      title: 'Nahaj Royal Treat',
      description: 'Payment for your order',
      logo: ''
    },
    callback: async function(response){
      if(response && (response.status === 'successful' || response.status === 'completed')){
        const order = await placeOrder({
          name, phone, email, address,
          paymentMethod:'Card Payment',
          flutterwaveRef: response.transaction_id || response.tx_ref || txRef,
          paymentStatus:'Paid'
        });
        setView('orderconfirm',{lastOrder:order});
      } else {
        showToast('Payment was not completed. Please try again.');
      }
    },
    onclose: function(){ /* customer closed the payment widget without paying */ }
  });
}

async function submitCheckout(){
  const name=document.getElementById('ckName').value.trim();
  const phone=document.getElementById('ckPhone').value.trim();
  const email=document.getElementById('ckEmail').value.trim();
  const address=document.getElementById('ckAddress').value.trim();
  const paymentMethod=document.getElementById('ckPay').value;
  if(!name||!phone||!address){ showToast('Please fill in name, phone and address'); return; }
  if(paymentMethod === 'Card Payment'){
    // Card orders are created only after a successful Flutterwave payment — see payWithFlutterwave()
    payWithFlutterwave();
    return;
  }
  const order = await placeOrder({name,phone,email,address,paymentMethod});
  setView('orderconfirm',{lastOrder:order});
}

/* ---- Schedule a future price change ---- */
function openScheduleForm(id){
  const p = DB.products.find(p=>p.id===id);
  const host = document.getElementById('prodFormHost');
  const pending = (p.scheduledPrices||[]).slice().sort((a,b)=>new Date(a.effectiveAt)-new Date(b.effectiveAt));
  host.innerHTML = `
  <div class="panel" style="max-width:520px;">
    <h4 style="margin-top:0;color:var(--maroon-deep);">Schedule Price Change — ${p.name}</h4>
    <p style="font-size:12.5px;color:#9a8672;">Current price: <b>${money(p.price)}</b>. Set a new price to take effect automatically at a future date and time — useful for planned promotions, seasonal pricing, or cost increases.</p>
    <label>New Price (₦)</label><input id="spPrice" type="number" placeholder="e.g. 32000">
    <label>Effective Date & Time</label><input id="spDate" type="datetime-local">
    <label>Note (optional)</label><input id="spNote" placeholder="e.g. Ramadan promo pricing">
    <div class="hero-cta" style="margin-top:14px;">
      <button class="btn-maroon" onclick="saveScheduleForm('${id}')">Schedule Change</button>
      <button class="btn-outline" onclick="document.getElementById('prodFormHost').innerHTML=''">Cancel</button>
    </div>
    ${pending.length? `
      <h5 style="color:var(--maroon-deep);margin:18px 0 8px;">Pending Scheduled Changes</h5>
      ${pending.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid #f5ecd8;">
        <span>${money(s.price)} on ${fmtDateTime(s.effectiveAt)}${s.note?` — ${s.note}`:''}</span>
        <button class="danger" style="border:1px solid var(--red);color:var(--red);background:#fff;padding:3px 9px;border-radius:6px;font-size:11px;" onclick="cancelScheduledChange('${id}','${s.id}')">Cancel</button>
      </div>`).join('')}
    ` : `<p style="font-size:12px;color:#bbb;margin-top:16px;">No pending scheduled changes for this product.</p>`}
  </div>`;
}
async function saveScheduleForm(id){
  const price = Number(document.getElementById('spPrice').value)||0;
  const dateVal = document.getElementById('spDate').value;
  const note = document.getElementById('spNote').value.trim();
  if(!price || !dateVal){ showToast('Enter a price and effective date/time'); return; }
  const p = DB.products.find(p=>p.id===id);
  if(!p.scheduledPrices) p.scheduledPrices = [];
  p.scheduledPrices.push({ id:uid('sch'), price, effectiveAt:new Date(dateVal).toISOString(), note });
  await saveProductRow(p);
  showToast('Price change scheduled');
  openScheduleForm(id);
}
async function cancelScheduledChange(productId, schedId){
  const p = DB.products.find(p=>p.id===productId);
  p.scheduledPrices = (p.scheduledPrices||[]).filter(s=>s.id!==schedId);
  await saveProductRow(p);
  showToast('Scheduled change cancelled');
  openScheduleForm(productId);
}

async function previewFormImage(event){
  const file = event.target.files[0];
  if(!file) return;
  const preview = document.getElementById('pfImgPreview');
  preview.innerHTML = '<span style="font-size:12px;color:#bbb;">Processing…</span>';
  try{
    const dataUrl = await compressImageFile(file);
    pendingProductImage = dataUrl;
    preview.innerHTML = `<img src="${dataUrl}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #eee0c4;">`;
  }catch(err){
    preview.innerHTML = '<span style="font-size:12px;color:var(--red);">Could not process that image</span>';
  }

async function saveProductForm(id){
  const data = {
    name:document.getElementById('pfName').value.trim(),
    category:document.getElementById('pfCat').value,
    price:Number(document.getElementById('pfPrice').value)||0,
    stock:Number(document.getElementById('pfStock').value)||0,
    emoji:document.getElementById('pfEmoji').value.trim()||'🎂',
    desc:document.getElementById('pfDesc').value.trim(),
  };
  if(!data.name){ showToast('Product name required'); return; }
  let ok;
  if(id){
    const existing = DB.products.find(p=>p.id===id);
    const priceChanged = existing.price !== data.price;
    Object.assign(existing, data);
    if(pendingProductImage) existing.img = pendingProductImage;
    if(priceChanged){
      if(!existing.priceHistory) existing.priceHistory = [];
      existing.priceHistory.unshift({price:data.price, date:new Date().toISOString(), note:'Manual price update'});
    }
    ok = await saveProductRow(existing);
  } else {
    const newProduct = { id:uid('p'), ...data, img: pendingProductImage||null, priceHistory:[{price:data.price, date:new Date().toISOString(), note:'Initial price'}], scheduledPrices:[] };
    ok = await insertProductRow(newProduct);
    if(ok) DB.products.push(newProduct);
  }
  pendingProductImage = null;
  if(ok) showToast('Product saved — live on storefront');
  render();
}
async function deleteProduct(id){
  const ok = await deleteProductRow(id);
  if(ok){ DB.products = DB.products.filter(p=>p.id!==id); showToast('Product deleted'); }
  render();
}

async function submitPOSSale(){
  const name = document.getElementById('psName').value.trim()||'Walk-in Customer';
  const phone = document.getElementById('psPhone').value.trim()||'N/A';
  const pid = document.getElementById('psProduct').value;
  const qty = Number(document.getElementById('psQty').value)||1;
  const p = DB.products.find(p=>p.id===pid);
  if(p.stock<qty){ showToast('Not enough stock'); return; }
  const orderId = uid('POS-');
  const { error } = await sb.rpc('place_pos_sale', {

  p.stock -= qty;

    ${Object.keys(byCat).length? Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
      <div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;"><span>${cat}</span><b>${money(amt)}</b></div><div class="barwrap"><div class="barfill" style="width:${(amt/revenue*100)||0}%"></div></div></div>
    `).join('') : '<p style="color:#bbb;">No data yet.</p>'}
  </div>
  <div class="panel">
    <h4 style="margin-top:0;color:var(--maroon-deep);">Order Status Breakdown</h4>
    ${['Pending','Processing','Delivered','Cancelled'].map(s=>{
      const n = DB.orders.filter(o=>o.status===s).length;
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #f5ecd8;"><span><span class="badge ${s.toLowerCase()}">${s}</span></span><b>${n}</b></div>`;
    }).join('')}
  </div>
  <div class="panel">
    <h4 style="margin-top:0;color:var(--maroon-deep);">Summary</h4>
    <p style="font-size:13px;color:#6b5347;line-height:1.8;">Total revenue of <b>${money(revenue)}</b> generated from <b>${DB.orders.length}</b> orders across <b>${DB.customers.length}</b> customers, spanning <b>${DB.products.length}</b> active products.</p>
  </div>`;
}

/* ---- AI Insights ---- */
function BizAI(){
  const revenue = DB.orders.reduce((a,o)=>a+o.total,0);
  const expTotal = DB.expenses.reduce((a,e)=>a+e.amount,0);
  const lowStock = DB.products.filter(p=>p.stock<=3 && p.stock>0);
  const outOfStock = DB.products.filter(p=>p.stock===0);
  const productSales = {};
  DB.orders.forEach(o=>o.items.forEach(i=>{ productSales[i.name]=(productSales[i.name]||0)+i.qty; }));
  const topEntry = Object.entries(productSales).sort((a,b)=>b[1]-a[1])[0];
  const margin = revenue? Math.round((revenue-expTotal)/revenue*100):0;
  const repeatCustomers = DB.customers.filter(c=>c.orders>1).length;

  const insights = [];
  if(topEntry) insights.push({ic:'🔥',t:'Best Seller',d:`"${topEntry[0]}" is your top performer with ${topEntry[1]} units sold. Consider featuring it prominently on the homepage and bundling it with slower-moving items.`});
  if(outOfStock.length) insights.push({ic:'🚨',t:'Restock Urgently',d:`${outOfStock.map(p=>p.name).join(', ')} ${outOfStock.length>1?'are':'is'} out of stock and unavailable for purchase — this is likely costing you sales right now.`});
  if(lowStock.length) insights.push({ic:'⚠️',t:'Low Stock Warning',d:`${lowStock.map(p=>p.name).join(', ')} ${lowStock.length>1?'are':'is'} running low. Restock soon to avoid missed orders.`});
  if(margin<20 && revenue>0) insights.push({ic:'📉',t:'Thin Profit Margin',d:`Your current profit margin is ${margin}%. Review ingredient and packaging costs, or consider a modest price adjustment on high-demand items.`});
  else if(revenue>0) insights.push({ic:'📈',t:'Healthy Margin',d:`Your profit margin sits at ${margin}%, which is a solid position. Reinvesting part of this into marketing could accelerate growth.`});
  if(repeatCustomers>0) insights.push({ic:'💛',t:'Loyal Customers',d:`${repeatCustomers} customer(s) have ordered more than once. A simple WhatsApp loyalty message or small discount could turn them into regulars.`});
  if(DB.orders.filter(o=>o.source==='Website').length>DB.orders.filter(o=>o.source==='POS').length) insights.push({ic:'🌐',t:'Website is Your Main Channel',d:'More orders are coming from the website than in-store. Keep the online catalogue fresh and consider WhatsApp status updates to drive more traffic.'});
  if(insights.length===0) insights.push({ic:'👋',t:'Getting Started',d:'Once you have a few sales and expenses recorded, AI Insights will surface trends, restock alerts and profit tips here automatically.'});

  return `
  <div class="biz-head"><h2>AI Business Insights</h2></div>
  <p style="font-size:12.5px;color:#9a8672;margin-top:-10px;margin-bottom:18px;">Generated automatically from your live sales, inventory and expense data.</p>
  ${insights.map(i=>`<div class="ai-card"><div class="ic">${i.ic}</div><div><h5>${i.t}</h5><p>${i.d}</p></div></div>`).join('')}
  `;
}

/* ---- Admin Settings ---- */
function BizAdmin(){
  const s = DB.settings || {};
  return `
  <div class="biz-head"><h2>Admin Settings</h2></div>
  <div class="panel">
    <h4 style="margin-top:0;color:var(--maroon-deep);">Payment Details</h4>
    <p style="font-size:12.5px;color:#9a8672;">These details are shown to customers at checkout and included automatically in their WhatsApp order confirmation when they choose Bank Transfer or Card Payment.</p>
    <label>Bank Name</label><input id="setBankName" value="${s.bankName||''}" placeholder="e.g. GTBank">
    <label>Account Number</label><input id="setBankAcct" value="${s.bankAccountNumber||''}" placeholder="e.g. 0123456789">
    <label>Account Name</label><input id="setBankAcctName" value="${s.bankAccountName||'Nahaj Royal Treat'}">
    <label>Card Payment Note</label><textarea id="setCardNote" rows="2">${s.cardPaymentNote||''}</textarea>
    <label>Flutterwave Public Key</label>
    <input id="setFlwKey" value="${s.flutterwavePublicKey||''}" placeholder="FLWPUBK_TEST-xxxxxxxxxxxx-X">
    <p style="font-size:11px;color:#a2897a;margin:4px 0 0;">Only your <b>public</b> key goes here — it's safe to use in the browser. Get it free from your <a href="https://dashboard.flutterwave.com/settings/apis" target="_blank" style="color:var(--maroon)">Flutterwave dashboard → Settings → API Keys</a>. Never share your secret key. Card payments stay off until this is filled in.</p>
    <button class="btn-maroon" style="margin-top:12px;" onclick="saveBizSettings()">Save Payment Details</button>
  </div>
  <div class="panel">
    <h4 style="margin-top:0;color:var(--maroon-deep);">Business Analytics Overview</h4>
    ${miniDashboardPreview()}
  </div>
  <div class="panel">
    <h4 style="margin-top:0;color:var(--maroon-deep);">Access Control</h4>
    <p style="font-size:13px;color:#6b5347;">Admin and staff share this NRT Smart POS dashboard, secured by Supabase Auth. Add or remove staff accounts, and reset passwords, from your <a href="https://supabase.com/dashboard/project/psvvecfbfvwfdddbbcpg/auth/users" target="_blank" style="color:var(--maroon)">Supabase dashboard → Authentication → Users</a>.</p>
    <button class="btn-outline" onclick="sendMyPasswordReset()">Send Me a Password Reset Email</button>
  </div>`;
}
async function sendMyPasswordReset(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || !user.email){ showToast('Could not find your account email'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(user.email);
  if(error){ showToast('Could not send reset email: ' + error.message); return; }
  showToast('Password reset email sent to ' + user.email);
}
async function saveBizSettings(){
  DB.settings.bankName = document.getElementById('setBankName').value.trim();
  DB.settings.bankAccountNumber = document.getElementById('setBankAcct').value.trim();
  DB.settings.bankAccountName = document.getElementById('setBankAcctName').value.trim() || 'Nahaj Royal Treat';
  DB.settings.cardPaymentNote = document.getElementById('setCardNote').value.trim();
  DB.settings.flutterwavePublicKey = document.getElementById('setFlwKey').value.trim();
  const ok = await saveSettings();
  if(ok) showToast('Payment details saved');
  render();
}

/* ===================== MASTER RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  let body = '';
  if(S.view==='business'){
    body = Header() + Business();
  } else {
    let content = '';
    if(S.view==='home') content = Home();
    else if(S.view==='shop') content = Shop();
    else if(S.view==='product') content = ProductDetail();
    else if(S.view==='cart') content = Cart();
    else if(S.view==='checkout') content = Checkout();
    else if(S.view==='orderconfirm') content = OrderConfirm();
    else if(S.view==='account') content = Account();
    body = Header() + `<main>${content}</main>` + Footer();
  }
  app.innerHTML = body + (S.toast? `<div id="toastBox" style="position:fixed;bottom:90px;right:22px;background:var(--maroon-deep);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:99;">${S.toast}</div>`:'');
}
window.setView = setView;

/* ===================== INIT ===================== */
(async function init(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Playfair Display',serif;color:#5c1130;font-size:20px;">Loading NAHAJ Royal Treat…</div>`;
  loadPriv();

  // restore an existing staff/admin session, if any
  const { data:{ session } } = await sb.auth.getSession();
  S.bizLoggedIn = !!session;

  await loadDB();
  if(S.bizLoggedIn) await applyScheduledPrices();
  render();

  // keep bizLoggedIn in sync if the session expires or the user signs in/out elsewhere
  sb.auth.onAuthStateChange((event, session)=>{
    const wasLoggedIn = S.bizLoggedIn;
    S.bizLoggedIn = !!session;
    if(wasLoggedIn !== S.bizLoggedIn) render();
  });

  // periodically check for scheduled price changes coming due while staff have the app open
  setInterval(async()=>{
    if(!S.bizLoggedIn) return;
    const changed = await applyScheduledPrices();
    if(changed) render();
  }, 30000);

  // register the service worker for installable, app-like behaviour on phones
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
